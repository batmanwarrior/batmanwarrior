<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Animated neon night signal for batmanwarrior</title>
  <desc id="desc">A cyberpunk night skyline with a sweeping signal beam, blinking terminal text, stars, and a neon patrol ticker.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#10142b"/>
      <stop offset="1" stop-color="#06181a"/>
    </linearGradient>

    <radialGradient id="moon" cx="48%" cy="44%" r="58%">
      <stop offset="0" stop-color="#fff8b4"/>
      <stop offset="0.45" stop-color="#ffe875"/>
      <stop offset="1" stop-color="#ffcd38"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff28a" stop-opacity="0.76"/>
      <stop offset="0.5" stop-color="#4fffe2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4fffe2" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f3d4f" stroke-width="1" opacity="0.34"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .star { animation: twinkle 3.6s ease-in-out infinite; }
    .star:nth-of-type(2n) { animation-delay: .8s; }
    .star:nth-of-type(3n) { animation-delay: 1.7s; }
    .beam { transform-origin: 600px 384px; animation: sweep 8s ease-in-out infinite; }
    .signal { transform-origin: 600px 143px; animation: breathe 2.8s ease-in-out infinite; }
    .cursor { animation: blink .9s steps(2, start) infinite; }
    .ticker { animation: slide 12s linear infinite; }
    .line2 { animation: flicker 5s ease-in-out infinite; }
    .line3 { animation: flicker 5s ease-in-out 1.7s infinite; }
    .window { animation: windowBlink 7s steps(1, end) infinite; }
    .window:nth-of-type(3n) { animation-delay: 1.2s; }
    .window:nth-of-type(4n) { animation-delay: 2.4s; }
    @keyframes sweep {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(9deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: .94; }
      50% { transform: scale(1.045); opacity: 1; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .28; transform: scale(.9); }
      45% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
    @keyframes flicker {
      0%, 94%, 100% { opacity: 1; }
      95% { opacity: .35; }
      96% { opacity: .9; }
      97% { opacity: .25; }
      98% { opacity: 1; }
    }
    @keyframes slide {
      from { transform: translateX(1220px); }
      to { transform: translateX(-680px); }
    }
    @keyframes windowBlink {
      0%, 78%, 100% { opacity: .35; }
      79%, 86% { opacity: .95; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="460" rx="22" fill="url(#sky)"/>
  <rect x="0" y="0" width="1200" height="460" rx="22" fill="url(#grid)" opacity="0.48"/>
  <rect x="2" y="2" width="1196" height="456" rx="20" fill="none" stroke="#1d5c70" stroke-width="3" opacity="0.7"/>
  <path d="M26 26h190M984 26h190M26 434h190M984 434h190" fill="none" stroke="#29ffd7" stroke-width="2" opacity="0.5"/>

  <g opacity="0.9" fill="#dffcff">
    <circle class="star" cx="108" cy="84" r="2.2"/>
    <circle class="star" cx="188" cy="143" r="1.7"/>
    <circle class="star" cx="294" cy="68" r="2.8"/>
    <circle class="star" cx="390" cy="116" r="1.5"/>
    <circle class="star" cx="468" cy="54" r="2.1"/>
    <circle class="star" cx="742" cy="72" r="2.2"/>
    <circle class="star" cx="826" cy="134" r="1.6"/>
    <circle class="star" cx="932" cy="82" r="2.5"/>
    <circle class="star" cx="1036" cy="142" r="1.8"/>
    <circle class="star" cx="1110" cy="72" r="2.1"/>
  </g>

  <g class="beam">
    <path d="M552 380 600 92 648 380Z" fill="url(#beam)" filter="url(#softGlow)"/>
    <g class="signal" filter="url(#glow)">
      <circle cx="600" cy="143" r="70" fill="url(#moon)"/>
      <path fill="#07111f" d="M600 133c-22-10-34-23-45-44 4 25-5 40-29 46 23 6 34 19 39 40 12-11 24-17 35-17s23 6 35 17c5-21 16-34 39-40-24-6-33-21-29-46-11 21-23 34-45 44Z"/>
      <circle cx="600" cy="143" r="78" fill="none" stroke="#fff28a" stroke-width="3" opacity="0.46"/>
    </g>
  </g>

  <g transform="translate(0 334)">
    <path d="M0 92H1200V126H0Z" fill="#03070d"/>
    <g fill="#07111f" stroke="#1d5c70" stroke-width="2">
      <path d="M0 92V62h42V28h52v64h10V2h38v90V48h74v44h45V12h66v80h46V38h86v54h46V68h57v24h40V22h78v70h52V54h70v38h42V9h48v83h36V44h68v48h42V20h56v72h42V58h64V126H0Z"/>
    </g>
    <g fill="#ffe875">
      <rect class="window" x="18" y="76" width="10" height="8"/>
      <rect class="window" x="58" y="44" width="10" height="8"/>
      <rect class="window" x="118" y="19" width="10" height="8"/>
      <rect class="window" x="164" y="62" width="10" height="8"/>
      <rect class="window" x="196" y="62" width="10" height="8"/>
      <rect class="window" x="286" y="31" width="10" height="8"/>
      <rect class="window" x="312" y="51" width="10" height="8"/>
      <rect class="window" x="396" y="60" width="10" height="8"/>
      <rect class="window" x="430" y="60" width="10" height="8"/>
      <rect class="window" x="528" y="78" width="10" height="8"/>
      <rect class="window" x="626" y="39" width="10" height="8"/>
      <rect class="window" x="662" y="59" width="10" height="8"/>
      <rect class="window" x="762" y="68" width="10" height="8"/>
      <rect class="window" x="862" y="24" width="10" height="8"/>
      <rect class="window" x="950" y="60" width="10" height="8"/>
      <rect class="window" x="1064" y="44" width="10" height="8"/>
      <rect class="window" x="1164" y="72" width="10" height="8"/>
    </g>
    <path d="M0 92h1200" stroke="#29ffd7" stroke-width="2" opacity="0.72"/>
  </g>

  <g transform="translate(70 248)">
    <rect x="0" y="0" width="372" height="142" rx="14" fill="#07111f" stroke="#29ffd7" stroke-width="2" opacity="0.92"/>
    <rect x="15" y="16" width="342" height="110" rx="8" fill="#02070b" stroke="#18485b"/>
    <circle cx="32" cy="33" r="5" fill="#ff4fa3"/>
    <circle cx="50" cy="33" r="5" fill="#ffe600"/>
    <circle cx="68" cy="33" r="5" fill="#00ff87"/>
    <text x="30" y="67" fill="#8ffff0" font-family="Consolas, Monaco, monospace" font-size="18">C:\&gt; run batmanwarrior.exe</text>
    <text class="line2" x="30" y="94" fill="#ffe875" font-family="Consolas, Monaco, monospace" font-size="18">signal: online</text>
    <text class="line3" x="30" y="119" fill="#ff7dbc" font-family="Consolas, Monaco, monospace" font-size="18">mode: absolutely unserious</text>
    <rect class="cursor" x="318" y="104" width="11" height="20" fill="#8ffff0"/>
  </g>

  <g clip-path="inset(406 0 16 0)">
    <text class="ticker" x="0" y="430" fill="#9afff1" font-family="Consolas, Monaco, monospace" font-size="19" opacity="0.86">
      night patrol active // signal systems nominal // no productivity detected // deploy the cape //
    </text>
  </g>
</svg>
